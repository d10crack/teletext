<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Teletext">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Teletext Dani</title>
<style>
:root{--bk:#000;--w:#fff;--y:#ff0;--c:#0ff;--g:#0f0;--r:#f33;--m:#f0f;--b:#22f;--dim:#8a8a8a;--line:#1f1f1f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bk);color:var(--w);font-family:"Consolas","Lucida Console","Courier New",monospace;font-size:15px;line-height:1.35}
a{color:var(--c);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1280px;margin:0 auto;padding:10px 14px 60px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-weight:bold;font-size:18px;letter-spacing:1px}
.top .pn{color:var(--w)}.top .brand{background:var(--b);color:var(--y);padding:0 10px}
.top .clock{margin-left:auto;color:var(--y)}
.banner{margin:8px 0 6px;padding:6px 10px;font-weight:bold;font-size:30px;letter-spacing:3px;line-height:1.1;text-transform:uppercase}
.banner small{display:block;font-size:13px;letter-spacing:1px;font-weight:normal;color:var(--w);text-transform:none}
.bg-r{background:#b00000}.bg-g{background:#007a00}.bg-y{background:#8a7d00}.bg-c{background:#006e7a}.bg-m{background:#7a007a}.bg-b{background:#2222aa}.bg-o{background:#a04a00}
.status{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--dim);margin-bottom:10px}
.status b{color:var(--w)}
.blink{animation:bl 1s steps(2,start) infinite;color:var(--y)}@keyframes bl{to{visibility:hidden}}
button{font-family:inherit;font-weight:bold;font-size:13px;background:var(--bk);color:var(--y);border:2px solid var(--y);padding:3px 10px;cursor:pointer}
button:hover{background:var(--y);color:var(--bk)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(520px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.box{border:1px solid #333;padding:10px 12px;background:#050505;min-width:0}
.box h3{margin:0 0 8px;font-size:15px;letter-spacing:1px;text-transform:uppercase}
.h{font-weight:bold;letter-spacing:1px;margin:18px 0 8px;font-size:17px;text-transform:uppercase}
.y{color:var(--y)}.c{color:var(--c)}.g{color:var(--g)}.r{color:var(--r)}.m{color:var(--m)}.w{color:var(--w)}.d{color:var(--dim)}
.big{font-size:26px;font-weight:bold}.mid{font-size:19px;font-weight:bold}.sm{font-size:12px}
table{border-collapse:collapse;width:100%}
td,th{padding:2px 6px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th{color:var(--c);font-weight:bold;font-size:12px;text-transform:uppercase}
td.n,th.n{text-align:right}
td.wrapc{white-space:normal}
tr.me td{background:#202000;color:var(--y);font-weight:bold}
.chip{display:inline-block;padding:0 6px;margin:0 4px 4px 0;font-size:12px;font-weight:bold}
.chip.r{background:var(--r);color:#000}.chip.g{background:var(--g);color:#000}.chip.y{background:var(--y);color:#000}.chip.c{background:var(--c);color:#000}.chip.m{background:var(--m);color:#000}.chip.w{background:#fff;color:#000}
.res{display:inline-block;width:20px;text-align:center;font-weight:bold;color:#000;margin-right:6px}
.res.W{background:var(--g)}.res.L{background:var(--r)}.res.D{background:var(--y)}
.vbar{display:inline-block;height:9px;background:var(--m);vertical-align:middle}
details summary{cursor:pointer;color:var(--c);font-size:13px;margin-top:6px}
.kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:2px 0}
.news a{display:block;padding:3px 0;border-bottom:1px solid var(--line);color:var(--w)}
.news a:hover{color:var(--y);text-decoration:none}
.news .src{color:var(--c);font-size:12px;margin-right:6px}
.foot{margin-top:20px;font-size:12px;color:var(--dim);border-top:2px solid var(--b);padding-top:8px}
.foot .err{color:var(--r)}
.race{position:relative}
.race.star{border:2px solid var(--y);background:#0d0d00}
.cd{font-size:34px;font-weight:bold;line-height:1}
.fast{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(7,1fr);z-index:5}
.fast a{display:block;text-align:center;font-weight:bold;padding:7px 4px;color:#000;letter-spacing:1px;font-size:14px}
.fast a.on{outline:3px solid #fff;outline-offset:-3px}
.fast .f1{background:var(--r)}.fast .f2{background:var(--g)}.fast .f3{background:var(--y)}.fast .f4{background:var(--c)}.fast .f5{background:var(--m)}.fast .f6{background:#66f}.fast .f7{background:#f80}
.wx{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center;font-size:12px}
.wx div{border:1px solid var(--line);padding:3px 0}
select{font-family:inherit;background:#000;color:var(--y);border:1px solid var(--y)}
.loading{padding:40px 0;color:var(--y);font-size:20px}
.cg{grid-template-columns:minmax(0,2fr) minmax(300px,1fr)}
.cfil{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
button.cm.on{background:var(--y);color:#000}
input[type=search]{font-family:inherit;font-size:13px;background:#000;color:var(--w);border:1px solid var(--y);padding:3px 6px;flex:1;min-width:120px}
.cdh{margin:10px 0 2px;padding:2px 6px;background:var(--b);color:var(--y);font-weight:bold;letter-spacing:1px;text-transform:uppercase}
.cdh.we{background:#7a007a;color:#fff}
.crow{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.ct{min-width:44px;font-weight:bold}.cb{flex:1;min-width:0;overflow-wrap:anywhere}.cp{white-space:nowrap;font-weight:bold;text-align:right}
@media(max-width:600px){.g2,.g3{grid-template-columns:1fr}.cg{grid-template-columns:minmax(0,1fr)}.banner{font-size:22px}
  html,body{font-size:13px}.wrap{padding:8px 8px calc(64px + env(safe-area-inset-bottom))}
  .box{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:8px}td,th{padding:2px 4px}
  .top{font-size:15px;gap:8px}.cd{font-size:28px}
  .fast{padding-bottom:env(safe-area-inset-bottom);background:#000}.fast a{font-size:10px;letter-spacing:0;padding:8px 1px;line-height:1.2;display:flex;align-items:center;justify-content:center}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="pn" id="pn">P100</span>
    <span class="brand">TELETEXT DANI</span>
    <span class="d" id="typed"></span>
    <span class="clock" id="clock"></span>
  </div>
  <div class="banner" id="banner"></div>
  <div class="status" id="status"></div>
  <div id="page"><div class="loading">Searching for page...</div></div>
  <div class="foot" id="foot"></div>
</div>
<nav class="fast">
  <a href="#100" class="f1" data-p="100">100 FOOD</a>
  <a href="#200" class="f2" data-p="200">200 SPORTS</a>
  <a href="#300" class="f3" data-p="300">300 RACES</a>
  <a href="#400" class="f4" data-p="400">400 SPAIN &amp; CAT</a>
  <a href="#500" class="f5" data-p="500">500 CONCERTS</a>
  <a href="#600" class="f6" data-p="600">600 WEEKEND</a>
  <a href="#700" class="f7" data-p="700">700 TRAINING</a>
</nav>
<script>
'use strict';
const TZ = 'Europe/Madrid';
const PAGES = {
  100: {key: 'food',   title: 'Food prices',          sub: 'Mercadona shelf prices and INE consumer price index', bg: 'bg-r'},
  200: {key: 'sports', title: 'Sports',               sub: 'Knicks, FC Barcelona, Girona FC, Basquet Girona', bg: 'bg-g'},
  300: {key: 'races',  title: 'Races 2027',           sub: 'My calendar, race-day weather, Catalan triathlon, news', bg: 'bg-y'},
  400: {key: 'spain',  title: 'Spain and Catalonia',  sub: 'Fuel, electricity, inflation, jobs, currency, weather', bg: 'bg-c'},
  500: {key: 'concerts', title: 'Concerts in Catalonia', sub: 'Next 60 days everywhere, big Barcelona venues a year ahead', bg: 'bg-m'},
  600: {key: 'weekend', title: 'This weekend', sub: 'Weather, games, races and concerts near home, Friday evening to Sunday', bg: 'bg-b', compose: weekendData},
  700: {key: 'training', title: 'My training', sub: 'Swim, bike, run from Garmin via intervals.icu: totals, intensity, best efforts, plan, fitness', bg: 'bg-o'}
};
const RENDER = {};
let cur = 100, timer = null, data = {};

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[ch])); }
function isNum(v) { return typeof v === 'number' && isFinite(v); }
function f(v, d = 2) { return isNum(v) ? v.toFixed(d) : '--'; }
function eur(v, d = 2) { return isNum(v) ? v.toFixed(d) + ' \u20ac' : '--'; }
/* sign + colour. up=true means "a rise is bad" (prices): rise red, fall green */
function chg(v, unit = '%', up = true, d = 1) {
  if (!isNum(v)) return '<span class="d">--</span>';
  const cls = v === 0 ? 'w' : ((v > 0) === up ? 'r' : 'g');
  return `<span class="${cls}">${v > 0 ? '+' : ''}${v.toFixed(d)}${unit}</span>`;
}
function link(url, text) { return /^https?:\/\//i.test(url || '') ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(text)}</a>` : esc(text); }
function dt(iso, opt) {
  if (!iso) return '--';
  const x = new Date(iso);
  if (isNaN(x)) return esc(iso);
  return x.toLocaleString('en-GB', Object.assign({timeZone: TZ}, opt || {weekday: 'short', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'}));
}
function dayOnly(ymd) { /* 'YYYY-MM-DD' calendar date, no timezone shift */
  if (!ymd) return '--';
  const [y, m, d] = ymd.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d, 12)).toLocaleDateString('en-GB', {timeZone: 'UTC', weekday: 'short', day: '2-digit', month: 'short', year: 'numeric'});
}
function todayMadrid() { return new Date().toLocaleDateString('en-CA', {timeZone: TZ}); }
function daysTo(ymd) {
  if (!ymd) return null;
  const a = Date.parse(todayMadrid() + 'T00:00:00Z'), b = Date.parse(ymd + 'T00:00:00Z');
  return Math.round((b - a) / 86400000);
}
function ago(sec) {
  if (!isNum(sec)) return 'unknown';
  if (sec < 90) return Math.round(sec) + ' s ago';
  if (sec < 5400) return Math.round(sec / 60) + ' min ago';
  if (sec < 172800) return (sec / 3600).toFixed(1) + ' h ago';
  return Math.round(sec / 86400) + ' days ago';
}
/* hand-built SVG sparkline; needs 2+ points, otherwise says the history is still building */
function spark(arr, w = 120, h = 26, color = '#0ff', label) {
  const v = (arr || []).filter(isNum);
  if (v.length < 2) return `<span class="d sm">${label !== undefined ? label : 'history builds daily'}</span>`;
  const lo = Math.min(...v), hi = Math.max(...v), span = (hi - lo) || 1;
  const pts = v.map((y, i) => [(i * (w - 4) / (v.length - 1) + 2).toFixed(1), (h - 3 - (y - lo) * (h - 6) / span).toFixed(1)]);
  const last = pts[pts.length - 1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="vertical-align:middle"><polyline fill="none" stroke="${color}" stroke-width="1.6" points="${pts.map(p => p.join(',')).join(' ')}"/><circle cx="${last[0]}" cy="${last[1]}" r="2.4" fill="#ff0"/></svg>`;
}
function newsList(items, n = 8) {
  if (!items || !items.length) return '<div class="d">No headlines this refresh.</div>';
  return '<div class="news">' + items.slice(0, n).map(a =>
    `<a href="${esc(a.link)}" target="_blank" rel="noopener"><span class="src">${esc(a.source || '')}</span>${esc(a.title)}<span class="d sm"> ${a.date ? dt(a.date, {day: '2-digit', month: 'short'}) : ''}</span></a>`).join('') + '</div>';
}

/* ---------- shell: clock, page switching, refresh ---------- */
function tick() {
  document.getElementById('clock').textContent = new Date().toLocaleString('en-GB', {timeZone: TZ, weekday: 'short', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit'});
}
function statusLine(d) {
  const s = [];
  if (d.from_seed) s.push(`<span class="y">Showing the bundled snapshot of ${dt(d.generated)}: live sources not reached yet</span>`);
  else s.push(`Updated <b>${dt(d.generated)}</b> (${ago(d.age_s)}${isNum(d.took_s) ? ', took ' + f(d.took_s, 1) + ' s' : ''})`);
  if (d.live && d.live.ok) s.push(`<span class="g">Scores live from ESPN at <b>${dt(d.live.at, {hour: '2-digit', minute: '2-digit'})}</b> (${d.live.ok} of ${d.live.of} teams; Basquet Girona, players and headlines from the copy above)</span>`);
  if (d.refreshing) s.push('<span class="blink">REFRESHING...</span>');
  if (d.refresh_error) s.push(`<span class="r">Last refresh failed${d.last_try ? ' at ' + dt(d.last_try, {hour: '2-digit', minute: '2-digit'}) : ''}: ${esc(d.refresh_error)}. Showing the last good copy.</span>`);
  const kept = Object.entries(d.kept || {});
  if (kept.length) s.push(`<span class="y">Kept from an earlier refresh (source failed now): ${kept.map(([k, g]) => esc(k) + ' of ' + dt(g, {day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'})).join(', ')}</span>`);
  s.push(`<button id="rf">${STATIC ? 'RELOAD' : 'REFRESH NOW'}</button>`);
  s.push(STATIC ? '<span class="sm">GitHub rebuilds sports on every run (asked hourly, it skips some), concerts every 6 h, the other pages once a day after 06:00. Swipe left/right or tap the colour bar to change page</span>'
                : '<span class="sm">Keys: type 100 / 200 / 300 / 400 / 500, or arrows</span>');
  document.getElementById('status').innerHTML = s.join('');
  document.getElementById('rf').onclick = () => load(cur, true);
}
function footer(d) {
  const src = (d.sources || []).map(s => link(s[1], s[0])).join(' &middot; ');
  const errs = (d.errors || []).map(e => `<div class="err">Source failed this refresh: ${esc(e)}</div>`).join('');
  document.getElementById('foot').innerHTML = `<div>Sources: ${src || '--'}</div>${errs}<div>Teletext Dani &middot; page ${cur} &middot; all times Europe/Madrid &middot; history stored in ${esc(d.storage || '--')}</div>`;
}
// Two ways to run: with app.py (live /api) or as a static site (GitHub Pages, iPhone home screen),
// where a scheduled GitHub Action rebuilds pages/<key>.json every hour.
let STATIC = false;
async function getPage(key, force) {
  if (!STATIC) {
    try {
      const r = await fetch(`api/${key}${force ? '?force=1' : ''}`, {cache: 'no-store'});
      if (r.ok && (r.headers.get('content-type') || '').includes('json')) return await r.json();
    } catch (e) { /* fall through to the static copy */ }
    STATIC = true;
  }
  const r = await fetch(`pages/${key}.json?t=${Date.now()}`, {cache: 'no-store'});
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const d = await r.json();
  if (d.generated) d.age_s = Math.round((Date.now() - Date.parse(d.generated)) / 1000);
  d.refreshing = false;
  if (key === 'sports') await liveSports(d);
  return d;
}
async function load(p, force) {
  const P = PAGES[p];
  clearTimeout(timer);
  try {
    const d = P.compose ? await P.compose(force) : await getPage(P.key, force);
    if (p !== cur) return;
    data[P.key] = d;
    statusLine(d);
    try { document.getElementById('page').innerHTML = RENDER[P.key](d); }
    catch (e) { document.getElementById('page').innerHTML = `<div class="r">This page could not be drawn: ${esc(e.message)}</div>`; console.error(e); }
    if (P.after) P.after(d);
    footer(d);
    timer = setTimeout(() => load(cur), d.refreshing ? 4000 : 300000);
  } catch (e) {
    document.getElementById('status').innerHTML = `<span class="r">${STATIC ? 'No connection and no saved copy of this page' : 'Server not reachable'} (${esc(e.message)}). Retrying in 15 s.</span>`;
    timer = setTimeout(() => load(cur), 15000);
  }
}
function go(p) {
  p = Number(p);
  if (!PAGES[p]) return;
  cur = p;
  const P = PAGES[p];
  document.getElementById('pn').textContent = 'P' + p;
  const b = document.getElementById('banner');
  b.className = 'banner ' + P.bg;
  b.innerHTML = `${esc(P.title)}<small>${esc(P.sub)}</small>`;
  document.querySelectorAll('.fast a').forEach(a => a.classList.toggle('on', a.dataset.p == p));
  if (location.hash !== '#' + p) history.replaceState(null, '', '#' + p);
  document.getElementById('page').innerHTML = '<div class="loading">Searching for page ' + p + '...</div>';
  load(p);
}
let typed = '';
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  const keys = Object.keys(PAGES).map(Number), i = keys.indexOf(cur);
  if (e.key === 'ArrowRight') return go(keys[(i + 1) % keys.length]);
  if (e.key === 'ArrowLeft') return go(keys[(i + keys.length - 1) % keys.length]);
  if (/^\d$/.test(e.key)) {
    typed = (typed + e.key).slice(-3);
    document.getElementById('typed').textContent = typed.padEnd(3, '-');
    if (typed.length === 3) { if (PAGES[typed]) go(typed); typed = ''; setTimeout(() => { document.getElementById('typed').textContent = ''; }, 600); }
  }
});
let tx = null, ty = 0;   // swipe between pages on a phone
document.addEventListener('touchstart', e => { const t = e.touches[0]; tx = t.clientX; ty = t.clientY; }, {passive: true});
document.addEventListener('touchend', e => {
  if (tx === null) return;
  const t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
  tx = null;
  if (Math.abs(dx) < 80 || Math.abs(dx) < 2 * Math.abs(dy)) return;
  if (e.target.closest && e.target.closest('table, .scroll')) return;
  const keys = Object.keys(PAGES).map(Number), i = keys.indexOf(cur);
  go(keys[(i + (dx < 0 ? 1 : keys.length - 1)) % keys.length]);
}, {passive: true});
window.addEventListener('hashchange', () => { const p = Number(location.hash.slice(1)); if (PAGES[p] && p !== cur) go(p); });

/* ---------- P100 FOOD ---------- */
const UNIT = {kg: '/kg', l: '/L', L: '/L', dozen: '/dozen', ud: '/unit', dc: '/dozen', dz: '/dozen'};
function u(fmt) { return UNIT[fmt] || (fmt ? '/' + fmt : ''); }
RENDER.food = d => {
  const ine = d.ine || [], reg = d.ine_region || {}, merc = d.mercadona || [];
  const period = ine.length ? ine[0].period : '';
  const byYoy = ine.filter(x => isNum(x.yoy)).slice().sort((a, b) => b.yoy - a.yoy);
  const byVol = ine.filter(x => isNum(x.volatility)).slice().sort((a, b) => b.volatility - a.volatility);
  const maxVol = byVol.length ? byVol[0].volatility : 1;
  const top = (arr, k, unit, up) => arr.map(x => `<div class="kv"><span>${esc(x.label)}</span>${k === 'volatility' ? `<span class="m">${f(x[k], 2)} pts</span>` : chg(x[k], unit, up)}</div>`).join('');
  let h = `<div class="grid g4">
    <div class="box"><h3 class="y">Food inflation, year on year</h3>
      <div class="kv"><span>Spain</span><span class="big">${chg(reg.Spain)}</span></div>
      <div class="kv"><span>Catalonia</span><span class="big">${chg(reg.Catalonia)}</span></div>
      <div class="d sm">INE, ${esc(period)}. "Food" subgroup of the CPI.</div></div>
    <div class="box"><h3 class="r">Rising fastest (y/y)</h3>${top(byYoy.slice(0, 5), 'yoy', '%', true)}</div>
    <div class="box"><h3 class="g">Falling fastest (y/y)</h3>${top(byYoy.slice(-5).reverse(), 'yoy', '%', true)}</div>
    <div class="box"><h3 class="m">Most volatile, last 12 months</h3>${top(byVol.slice(0, 5), 'volatility', '', true)}
      <div class="d sm">Volatility = standard deviation of the 12 monthly changes of the index.</div></div>
  </div>`;

  h += `<div class="h y">Supermarket basket: Mercadona, Barcelona warehouse</div>
  <div class="d sm" style="margin-bottom:8px">Median shelf price across the aisle's products sold in its main unit (per kg, litre or dozen), today.
  Evolution lines build up one point per day while the app runs (${d.tracked_days || 0} day${d.tracked_days === 1 ? '' : 's'} recorded so far).</div>
  <div class="grid g3">` + merc.map(c => {
    const rows = (c.products || []).map(p => `<tr><td class="wrapc">${link(p.url, p.name)}</td><td class="d">${esc(p.size)}</td>
      <td class="n">${p.prev_unit_price ? `<s class="d">${eur(p.prev_unit_price)}</s> ` : ''}${eur(p.unit_price)}</td>
      <td class="n c">${eur(p.ref_price)}${u(p.ref_format)}</td></tr>`).join('');
    return `<div class="box"><h3 class="c">${esc(c.label)} <span class="d sm">(${c.n} products)</span></h3>
      <div class="kv"><span>Median</span><span class="mid y">${eur(c.median)}${u(c.fmt)}</span></div>
      <div class="kv"><span>Range today</span><span>${eur(c.min)}${u(c.fmt)} to ${eur(c.max)}${u(c.fmt)}</span></div>
      <div class="kv"><span>vs 7 days / 30 days</span><span>${chg(c.chg7)} / ${chg(c.chg30)}</span></div>

function weatherTxt(w) {

function timeline(rs) {
  const W = 1200, H = 92, t0 = Date.parse(todayMadrid() + 'T00:00:00Z');
  const ds = rs.map(r => Date.parse((r.date || r.weather_date) + 'T00:00:00Z')).filter(isNum);
  if (!ds.length) return '';
  const end = new Date(Math.max(...ds) + 20 * 86400000), span = end - t0;
  const x = ms => 20 + (ms - t0) / span * (W - 40);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;background:#050505;border:1px solid #333"><line x1="20" y1="50" x2="${W - 20}" y2="50" stroke="#22f" stroke-width="4"/>`;
  const m = new Date(t0); m.setUTCDate(1);
  for (let k = 0; k < 14; k++) {
    const ms = Date.UTC(m.getUTCFullYear(), m.getUTCMonth() + k + 1, 1);
    if (ms > end) break;
    s += `<line x1="${x(ms)}" y1="44" x2="${x(ms)}" y2="56" stroke="#888"/><text x="${x(ms) + 3}" y="70" fill="#888" font-size="12" font-family="Consolas,monospace">${new Date(ms).toLocaleDateString('en-GB', {timeZone: 'UTC', month: 'short'})}</text>`;

    s += `<text x="${cx}" y="${up ? 28 : 86}" fill="${r.date ? col : '#f33'}" font-size="12" font-weight="bold" text-anchor="middle" font-family="Consolas,monospace">${esc(r.short || r.name.split(' ').slice(0, 3).join(' '))}${r.date ? '' : ' ?'}</text>`;

  return s + '</svg>';
}

const FUELN = {g95: 'Petrol 95', diesel: 'Diesel', g98: 'Petrol 98'};
function powerChart(day, p) {
  const hs = p.hours || [];
  if (!hs.length) return '';
  const W = 600, H = 150, mx = Math.max(...hs.map(h => h[1])), bw = (W - 30) / hs.length;
  const nowH = new Date().toLocaleTimeString('en-GB', {timeZone: TZ, hour: '2-digit', hour12: false}) + ':00';
  const isToday = day === todayMadrid();
  let s = `<svg viewBox="0 0 ${W} ${H + 18}" width="100%" style="display:block">`;
  hs.forEach((h, i) => {
    const bh = Math.max(1, h[1] / mx * (H - 10)), x = 26 + i * bw;
    const col = h[1] <= p.avg * 0.8 ? '#0f0' : h[1] >= p.avg * 1.2 ? '#f33' : '#ff0';
    const on = isToday && h[0] === nowH;
    s += `<rect x="${x.toFixed(1)}" y="${(H - bh).toFixed(1)}" width="${(bw - 2).toFixed(1)}" height="${bh.toFixed(1)}" fill="${col}" ${on ? 'stroke="#fff" stroke-width="2"' : ''}><title>${h[0]}  ${h[1].toFixed(1)} EUR/MWh</title></rect>`;
    if (i % 3 === 0) s += `<text x="${x.toFixed(1)}" y="${H + 14}" fill="#888" font-size="11" font-family="Consolas,monospace">${h[0].slice(0, 2)}</text>`;
  });
  const ay = H - p.avg / mx * (H - 10);
  s += `<line x1="26" x2="${W}" y1="${ay.toFixed(1)}" y2="${ay.toFixed(1)}" stroke="#0ff" stroke-dasharray="4 3"/><text x="0" y="${(ay + 4).toFixed(1)}" fill="#0ff" font-size="11" font-family="Consolas,monospace">avg</text>`;
  return s + '</svg>';
}

      <div>
        <div class="box"><h3 class="m">Arena shows (Palau Sant Jordi, Sant Jordi Club, Olympic Stadium)</h3>
          ${arena.length ? arena.map(e => `<div class="kv"><span>${link(e.url, e.name)}<br><span class="d sm">${esc(e.venue)}</span></span><span class="n"><b class="y">${concDay(e.date).txt}</b><br><span class="sm">${esc(e.price || '?')}</span></span></div>`).join('') : '<div class="d">None listed.</div>'}</div>
        <div class="box" style="margin-top:12px"><h3 class="y">Festivals and concert cycles running</h3>
          <div style="max-height:520px;overflow-y:auto">${cy.length ? cy.map(e => `<div class="kv"><span>${link(e.url, e.name)}<br><span class="d sm">${esc(e.venue || '')}, ${esc(e.town || '')}${isNum(e.km) ? ' &middot; ' + Math.round(e.km) + ' km' : ''}</span></span><span class="n sm">until<br><b>${concDay(e.until || e.date).txt}</b></span></div>`).join('') : '<div class="d">None listed.</div>'}</div>
          <div class="d sm">Listed by the agendas as one long entry (more than a week), so they are kept out of the day list.</div></div>
      </div>
    </div>
    <details class="d sm" style="margin-top:8px"><summary>About this list</summary>Concerts in Catalonia for the next ${w.days || '--'} days as listed by the Generalitat cultural agenda (${isNum(cnt.catalonia_agenda) ? cnt.catalonia_agenda : '--'} entries) and the Barcelona city agenda (${isNum(cnt.barcelona_agenda) ? cnt.barcelona_agenda : '--'} entries); a show is merged into one row where the name and venue match, or the venue and start time do.
      Big Barcelona venues are listed ${w.big_days || '--'} days ahead, from the Barcelona city agenda only: ${esc((d.big_venues || []).join(', '))}. Near home = within ${w.near_km || '--'} km of Santa Coloma de Farners in a straight line.
      Genre only where the Barcelona agenda gives one. Prices as published by the agenda, before booking fees. A show its promoter never sent to either agenda is missing: check the venue before ruling one out.</details>`;
};
function concDraw(d) {
  const box = document.getElementById('clist');
  if (!box) return;
  const L = concFilter(d.concerts || []), cap = CF.all ? L.length : 150;
  let html = '', last = '';
  L.slice(0, cap).forEach(e => {
    if (e.date !== last) { last = e.date; const x = concDay(e.date), k = daysTo(e.date);
      html += `<div class="cdh${x.wd === 0 || x.wd === 6 ? ' we' : ''}">${esc(x.txt)} <span class="sm">${k === 0 ? 'TODAY' : k === 1 ? 'tomorrow' : 'in ' + k + ' days'}</span></div>`; }
    html += concRow(e);
  });
  if (!L.length) html = '<div class="d" style="padding:10px 0">No concert matches this filter.</div>';
  if (L.length > cap) html += `<div style="margin-top:8px"><button id="cmore">Show all ${L.length}</button> <span class="d sm">showing the first ${cap}</span></div>`;
  box.innerHTML = `<div class="d sm" style="margin-bottom:4px">${L.length} concert${L.length === 1 ? '' : 's'}</div>` + html;
  const more = document.getElementById('cmore');
  if (more) more.onclick = () => { CF.all = true; concDraw(d); };
}
PAGES[500].after = d => {
  document.querySelectorAll('button.cm').forEach(b => { b.onclick = () => {
    CF.mode = b.dataset.m; CF.all = false;
    document.querySelectorAll('button.cm').forEach(x => x.classList.toggle('on', x === b)); concDraw(d); }; });
  const g = document.getElementById('cgen'), fr = document.getElementById('cfree'), q = document.getElementById('cq');
  if (g) g.onchange = () => { CF.genre = g.value; CF.all = false; concDraw(d); };
  if (fr) fr.onchange = () => { CF.free = fr.checked; concDraw(d); };
  if (q) q.oninput = () => { CF.q = q.value; concDraw(d); };
  concDraw(d);
};

/* ---------- start ---------- */
tick(); setInterval(tick, 1000);
go(PAGES[Number(location.hash.slice(1))] ? Number(location.hash.slice(1)) : 100);
</script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');</script>
